<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Không gian hỏi đáp và quản lý tài liệu pháp lý."
    />
    <meta name="api-base" content="http://127.0.0.1:8000" />
    <meta name="google-client-id" content="" />
    <script>
      if (["legal-ai-dev-aeb51.web.app.", "legal-ai-dev-aeb51.firebaseapp.com."].includes(location.hostname)) {
        const canonical = new URL(location.href);
        canonical.hostname = canonical.hostname.slice(0, -1);
        location.replace(canonical.href);
      }
    </script>
    <title>Legal AI · Legal Assistant</title>
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <p id="loading-status" role="status">Đang tải giao diện…</p>
    <noscript>Bật JavaScript để sử dụng Legal AI.</noscript>
    <button
      id="menu-overlay"
      class="menu-overlay"
      aria-label="Đóng menu"
      hidden
    ></button>

    <template data-part="auth"></template>
    <template data-part="sidebar"></template>

    <div id="app-shell" class="main-shell" hidden>
      <template data-part="header"></template>
      <main>
        <template data-part="chat"></template>
        <template data-part="library"></template>
        <template data-part="settings"></template>
        <template data-part="footer"></template>
      </main>
      <template data-part="evidence"></template>
    </div>

    <template data-part="upload"></template>
    <template data-part="document"></template>
    <p id="toast" class="toast" role="status" hidden></p>
  </body>
</html>
