<header class="topbar">
  <div>
    <button
      id="menu-toggle"
      class="menu-toggle"
      aria-controls="sidebar"
      aria-expanded="false"
      aria-label="Mở menu"
    >
      ☰
    </button>
    <span>Không gian làm việc /</span>
    <strong id="page-label">Hỏi đáp</strong>
  </div>
  <div class="topbar-actions">
    <span id="backend-label" class="preview-label">Đã kết nối</span>
    <button
      type="button"
      class="secondary-button"
      data-settings-target="ai-card"
    >
      Kết nối AI
    </button>
    <button id="register-action" type="button" class="secondary-button" hidden>
      Đăng ký
    </button>
    <button
      id="account-action"
      type="button"
      class="secondary-button"
      data-settings-target="account-card"
    >
      Tài khoản
    </button>
  </div>
</header>
