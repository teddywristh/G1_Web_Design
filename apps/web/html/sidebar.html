<aside id="sidebar" class="sidebar" hidden>
  <a class="brand" href="index.html"
    ><span class="logo-container"
      ><span class="brand-mark">L</span
      ><img
        class="system-logo"
        data-logo
        src="assets/logo.png"
        alt="Logo Legal AI"
        width="40"
        height="42"
        hidden /></span
    ><span>Legal AI<small>LEGAL ASSISTANT</small></span></a
  >
  <div id="workspace-nav">
    <button class="new-chat secondary-button" data-action="new-chat">
      Cuộc trò chuyện mới
    </button>
    <nav aria-label="Điều hướng chính">
      <button data-view="chat" class="active">
        Hỏi đáp <span id="chat-count">0</span>
      </button>
      <button data-view="library">
        Thư viện tài liệu <span id="document-count">0</span>
      </button>
    </nav>
    <section class="chat-history" aria-labelledby="history-label">
      <h2 id="history-label">Cuộc trò chuyện</h2>
      <p id="history-empty" class="small-print">
        Hội thoại của bạn sẽ xuất hiện ở đây.
      </p>
      <div id="history-list"></div>
    </section>
  </div>
  <nav id="settings-nav" aria-label="Thiết lập" hidden>
    <button data-settings-page="account" class="active">Tài khoản</button>
    <button data-settings-page="ai">Kết nối AI</button>
  </nav>
  <button
    id="profile-button"
    class="profile-button"
    aria-label="Mở tài khoản và thiết lập"
  >
    <span class="profile-avatar" aria-hidden="true">L</span>
    <span
      ><strong id="user-name">Không gian cá nhân</strong
      ><small id="user-role"></small
    ></span>
  </button>
</aside>
