name: Backend CI
on:
  push:
    paths: ["apps/api/**", "infra/firebase/**", "infra/docker/**", "infra/nginx/**", "firebase.json", "firebase.docker.json", "scripts/backend_admin.py", ".github/workflows/backend-ci.yml", "pytest.ini"]
  pull_request:
    paths: ["apps/api/**", "infra/firebase/**", "infra/docker/**", "infra/nginx/**", "firebase.json", "firebase.docker.json", "scripts/backend_admin.py", ".github/workflows/backend-ci.yml", "pytest.ini"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-java@v4
        with: {distribution: "temurin", java-version: "21"}
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check apps/api scripts/backend_admin.py
      - run: ruff format --check apps/api scripts/backend_admin.py
      - run: python -m compileall apps/api/app scripts/backend_admin.py
      - run: python -m pytest -m 'not integration' -q --junitxml=test-results/backend-unit.xml
      - run: npm install -g firebase-tools@15.12.0
      - name: Firebase integration and client access rules
        run: firebase emulators:exec --project demo-legal-api --only auth,firestore,storage 'python -m pytest -m integration -q --junitxml=test-results/backend-integration.xml'
        env:
          RUN_FIREBASE_INTEGRATION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: "test-results/*.xml"
          retention-days: 3
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp apps/api/.env.example apps/api/.env
      - run: docker compose -f infra/docker/docker-compose.yml config --quiet
      - run: docker build -t legal-api-backend:verify -f infra/docker/Dockerfile.api apps/api
      - name: Validate gateway configuration
        run: >-
          docker run --rm --add-host backend:127.0.0.1
          --mount type=bind,source="$GITHUB_WORKSPACE/infra/nginx/api.conf",target=/etc/nginx/conf.d/default.conf,readonly
          nginx:1.28-alpine nginx -t
      - name: Check container API import
        run: docker run --rm legal-api-backend:verify python -c 'from app.main import app; app.openapi()'
