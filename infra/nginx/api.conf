# Single edge gateway: all backend replicas share this gateway's rate zones.
# remote_addr is the actual peer; do not trust arbitrary X-Forwarded-For headers.
log_format backend_json escape=json
    '{"event":"gateway_request","requestId":"$request_id","method":"$request_method","path":"$uri","status":$status}';
map $http_origin $allowed_origin {
    default "";
    "http://localhost:3000" "http://localhost:3000";
}
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

upstream backend_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    access_log /var/log/nginx/access.log backend_json;
    client_max_body_size 1m;
    client_body_timeout 60s;
    limit_req zone=api_rate burst=30 nodelay;
    limit_req_status 429;
    limit_conn api_connections 5;
    limit_conn_status 429;
    error_page 413 = @too_large;
    error_page 429 = @limited;
    error_page 502 504 = @unavailable;

    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;

    location ~ ^/api/v1/admin/documents/[^/]+/file$ {
        client_max_body_size 20m;
        proxy_request_buffering off;
        proxy_pass http://backend_api;
    }
    location / {
        proxy_pass http://backend_api;
    }
    location @too_large {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Expose-Headers "X-Request-ID, Retry-After" always;
        add_header Vary Origin always;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"body_too_large","message":"Request exceeds gateway limit"},"requestId":"$request_id"}';
    }
    location @limited {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Expose-Headers "X-Request-ID, Retry-After" always;
        add_header Vary Origin always;
        add_header Retry-After 30 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"rate_limited","message":"Retry later"},"requestId":"$request_id"}';
    }
    location @unavailable {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        add_header Access-Control-Allow-Origin $allowed_origin always;
        add_header Access-Control-Expose-Headers "X-Request-ID, Retry-After" always;
        add_header Vary Origin always;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"provider_unavailable","message":"Backend unavailable"},"requestId":"$request_id"}';
    }
}
